name: mspchallenge-dev

services:
  simulations:
    build:
      context: output/linux-x64
      dockerfile: Dockerfile
    ports:
      - "${WATCHDOG_PORT:-45000}:${WATCHDOG_PORT:-45000}"
    restart: always
    environment:
      DOCKER: 1
      WATCHDOG_PORT: ${WATCHDOG_PORT:-45000}
      MSP_MEL_EWE_DUMP_ENABLED: "${MSP_MEL_EWE_DUMP_ENABLED:-0}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
        - simulations_data:/app:rw
    networks:
      - msp_network

volumes:
    simulations_data:

networks:
  msp_network:
